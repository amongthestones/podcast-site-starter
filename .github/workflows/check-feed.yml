# Rebuilds the site when the feed changes. Use this for Cloudflare Pages
# (which has no scheduled builds). Netlify sites can use this or the
# built-in scheduled function in netlify/functions/.
#
# Setup: Settings > Secrets and variables > Actions
#   Variables: PODCAST_FEED_URL, SITE_URL
#   Secret:    BUILD_HOOK_URL (your Cloudflare deploy hook or Netlify build hook)
#
# Gotcha: GitHub turns off scheduled workflows in forks until you enable
# Actions, and again after 60 days with no commits to the repo.
name: Check feed for new episodes

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node rebuild/check-feed.mjs
        env:
          PODCAST_FEED_URL: ${{ vars.PODCAST_FEED_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
          BUILD_HOOK_URL: ${{ secrets.BUILD_HOOK_URL }}
